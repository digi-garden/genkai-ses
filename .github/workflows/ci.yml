name: CI

# docs/design/07_test_design.md 5章
# カードの検証（validate:cards）とシミュレータ（simulate）は Phase 1-A で追加する。

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + dependency-cruiser)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (production base /genkai-ses/)
        run: npm run build

      - name: Bundle size (warning only)
        run: npm run size

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E through the router proxy
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
