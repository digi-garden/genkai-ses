<html lang="ja">
<head>
<meta charset="utf-8">
<title>S02 会社名入力</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5BAC1}a:hover{color:#F2F3F5}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1E1F22;color:#F2F3F5;font-family:'M PLUS 1 Code',ui-monospace,'Hiragino Sans','Noto Sans JP',monospace;display:flex;flex-direction:column;overflow:hidden">
<main style="flex-grow:1;padding:48px 24px;display:flex;flex-direction:column;gap:24px">
<p style="margin:0;font-size:12px;color:#949BA4">STEP 1 / 2</p>
<h1 style="margin:0;font-size:20px;line-height:1.4">あなたの会社名を<br>決めてください</h1>
<div style="display:flex;flex-direction:column;gap:8px">
<label for="company" style="font-size:13px;font-weight:700">会社名（15文字まで）</label>
<input id="company" type="text" value="@genkai_ses" maxlength="15" aria-invalid="true" aria-describedby="company-err" style="min-height:52px;box-sizing:border-box;padding:12px 14px;background:#313338;border:2px solid #EF4444;border-radius:6px;color:#F2F3F5;font-family:inherit;font-size:16px">
<p id="company-err" style="margin:0;font-size:13px;color:#F87171">記号（@ #）や URL は使えません</p>
<p style="margin:0;font-size:12px;line-height:1.6;color:#B5BAC1">実在の企業名は使えません。会社名は架空のものとして結果画像に印字されます。空欄のときは「限界SES株式会社」になります。</p>
</div>
</main>
<footer style="padding:16px 24px 32px;display:flex;flex-direction:column;gap:12px">
<button type="button" style="min-height:52px;box-sizing:border-box;padding:12px 16px;background:#22C55E;border:0;border-radius:10px;color:#0B1A10;font-family:inherit;font-size:16px;font-weight:700">次へ</button>
</footer></div>
</x-dc>
